<script>
(function(){
  "use strict";
  // Place the live site's header first in <body> and its footer last.
  function mount(){
    var tpl=document.getElementById("rwc-store-chrome");
    if(!tpl || document.getElementById("rwc-store-head")) return;
    var frag=tpl.content.cloneNode(true);
    var head=frag.getElementById ? frag.getElementById("rwc-store-head") : frag.querySelector("#rwc-store-head");
    var foot=frag.querySelector("#rwc-store-foot");
    document.body.insertBefore(head, document.body.firstChild);
    document.body.appendChild(foot);
    var y=document.querySelector("#rwc-store-foot [data-rwc-year]"); if(y) y.textContent=new Date().getFullYear();
    syncCart();
  }
  // Mirror Squarespace's own cart count into our cart link.
  function syncCart(){
    var el=document.querySelector("[data-rwc-cart-count]"); if(!el) return;
    var n=0;
    try{
      var src=document.querySelector(".sqs-cart-quantity, .cart-quantity, .icon-cart-quantity");
      if(src) n=parseInt(src.textContent,10)||0;
    }catch(e){}
    el.textContent=n>0?String(n):"";
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",mount); else mount();
  document.addEventListener("click",function(){ setTimeout(syncCart,800); });
})();
</script>
<script>
// src/scripts/mobile-nav.js
(function() {
  "use strict";
  var MOBILE = "(max-width: 900px)";
  function init() {
    var burger = document.querySelector("[data-rwc-burger]");
    if (!burger) return;
    var navId = burger.getAttribute("aria-controls");
    var nav = navId ? document.getElementById(navId) : null;
    if (!nav) return;
    var mq = window.matchMedia(MOBILE);
    function isOpen() {
      return burger.getAttribute("aria-expanded") === "true";
    }
    function setOpen(open) {
      burger.setAttribute("aria-expanded", open ? "true" : "false");
      nav.style.display = open ? "flex" : "";
    }
    function close() {
      if (isOpen()) setOpen(false);
    }
    burger.addEventListener("click", function() {
      setOpen(!isOpen());
    });
    document.addEventListener("keydown", function(event) {
      if (event.key !== "Escape" && event.key !== "Esc") return;
      if (!isOpen()) return;
      close();
      burger.focus();
    });
    document.addEventListener("click", function(event) {
      if (!isOpen()) return;
      if (burger.contains(event.target) || nav.contains(event.target)) return;
      close();
    });
    nav.addEventListener("click", function(event) {
      if (event.target.closest("a")) close();
    });
    function syncToBreakpoint() {
      if (!mq.matches) setOpen(false);
    }
    if (typeof mq.addEventListener === "function") {
      mq.addEventListener("change", syncToBreakpoint);
    } else if (typeof mq.addListener === "function") {
      mq.addListener(syncToBreakpoint);
    }
    syncToBreakpoint();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
