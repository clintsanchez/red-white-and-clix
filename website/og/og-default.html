<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "ArchivoBlack"; src: url("archivo-black.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "SpaceGrotesk"; src: url("space-grotesk-500.woff2") format("woff2"); font-weight: 500; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0B0D14; overflow:hidden; position:relative; font-family:"SpaceGrotesk",Arial,sans-serif; }
  .fig { position:absolute; right:-40px; top:0; width:660px; height:630px; object-fit:cover; object-position:60% 45%; filter:brightness(.62) saturate(.95); }
  .scrim { position:absolute; inset:0; background:linear-gradient(100deg,#0B0D14 0%,#0B0D14 40%,rgba(11,13,20,.72) 62%,rgba(11,13,20,.25) 100%); }
  .wrap { position:absolute; inset:0; padding:72px 64px; display:flex; flex-direction:column; justify-content:space-between; }
  .logo { width:104px; height:104px; }
  h1 { font-family:"ArchivoBlack",Arial,sans-serif; font-size:74px; line-height:1.02; letter-spacing:-.03em; color:#fff; max-width:17ch; }
  .meta { display:flex; align-items:center; gap:18px; }
  .pill { background:#B91C1C; color:#fff; font-weight:500; font-size:26px; padding:12px 26px; border-radius:999px; }
  .kick { color:#fff; opacity:.82; font-size:26px; letter-spacing:.12em; }
</style></head>
<body>
  <img class="fig" src="hero.webp" alt="">
  <div class="scrim"></div>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="">
    <h1>Play Together. Stand With Veterans.</h1>
    <div class="meta">
      <span class="pill">November 7&ndash;8, 2026</span>
      <span class="kick">ONE COMMUNITY &middot; ONE MISSION</span>
    </div>
  </div>
</body></html>
